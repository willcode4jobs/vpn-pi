<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Island Hopper</title>
<style>
  /* Self-contained (no CDN; the island has no internet). Warm/editorial, light + dark.
     Refs: Anthropic (warm paper + serif headlines), Nintendo (rounded tiles, pill tabs),
     Chase (confident blue for "internet"). Serif = system fonts, so it works offline. */
  :root{
    --bg:#F2EEE6; --surface:#FFFFFF; --surface-2:#F7F2EA; --ink:#1C1813; --muted:#6E6457; --line:#E6DFD2;
    --primary:#D14D38; --on-primary:#FFFFFF; --primary-soft:#F6E0D9; --on-primary-soft:#7A2415;
    --ok:#1E8E3E; --error:#C0271D;
    --island-bg:#E2F3E7; --island-fg:#1B7A37; --internet-bg:#E1ECFB; --internet-fg:#1463C7;
    --island-grad:linear-gradient(135deg,#1E8E3E,#125F2A); --internet-grad:linear-gradient(135deg,#1463C7,#0E4385);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --r-s:12px; --r-l:18px; --r-lg:26px; --r-full:999px;
    --e1:0 1px 2px rgba(40,30,20,.06),0 6px 18px rgba(40,30,20,.05);
    --e2:0 14px 38px rgba(40,30,20,.16);
  }
  :root[data-theme="dark"]{
    --bg:#15120E; --surface:#211C16; --surface-2:#2A241C; --ink:#F3EEE5; --muted:#A99E8D; --line:#39312A;
    --primary:#E86A4A; --on-primary:#1B0E09; --primary-soft:#3A201A; --on-primary-soft:#F4C6B8;
    --ok:#43C46B; --error:#FF6B5E;
    --island-bg:#15301F; --island-fg:#52CE78; --internet-bg:#12233E; --internet-fg:#6BA8F2;
    --island-grad:linear-gradient(135deg,#1E8E3E,#0E4D22); --internet-grad:linear-gradient(135deg,#1F6FD0,#0E3E78);
    --e1:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35); --e2:0 16px 40px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.85rem;padding:1rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--line)}
  .bar h1{font:600 1.7rem var(--serif);letter-spacing:-.02em;margin:0}
  .bar .sp{flex:1}
  .chip{display:inline-flex;align-items:center;gap:.45rem;padding:.4rem .85rem;border-radius:var(--r-full);font-weight:700;font-size:.82rem}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
  .chip.island{background:var(--island-bg);color:var(--island-fg)}
  .chip.internet{background:var(--internet-bg);color:var(--internet-fg)}
  .who{color:var(--muted);font-size:.82rem}
  .iconbtn{appearance:none;border:0;background:none;color:var(--muted);font:600 .95rem var(--sans);cursor:pointer;padding:.4rem .7rem;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:.4rem} .iconbtn:hover{background:var(--surface-2);color:var(--ink)}
  .iconbtn svg{width:18px;height:18px;flex-shrink:0} .iconbtn.on{color:var(--ok)}
  .lockbtn{border:2px solid var(--primary);color:var(--primary);padding:.4rem .9rem} .lockbtn:hover{background:var(--primary-soft);color:var(--on-primary-soft)}
  .lockbtn.on{border-color:var(--ok);color:var(--ok)} .lockbtn.on:hover{background:var(--surface-2)}
  .avatar svg{width:22px;height:22px}
  .tabs{display:flex;gap:.4rem;padding:.65rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .98rem var(--sans);padding:.5rem 1.05rem;cursor:pointer;border-radius:var(--r-full);white-space:nowrap;transition:.15s}
  .tabs button:hover{background:var(--surface-2);color:var(--ink)}
  .tabs button.on{background:var(--primary-soft);color:var(--on-primary-soft)}
  main{max-width:860px;margin:1.75rem auto;padding:0 1.25rem 5rem}
  .hero{color:#fff;border-radius:var(--r-lg);padding:2.6rem 2.2rem;margin-bottom:1.5rem;box-shadow:var(--e2);background:var(--island-grad)}
  .hero.internet{background:var(--internet-grad)}
  .hero .eyebrow{font:700 .72rem var(--sans);letter-spacing:.22em;opacity:.85;margin-bottom:.9rem}
  .hero .htitle{font:600 2.2rem/1.08 var(--serif);letter-spacing:-.02em;margin:0 0 .6rem}
  .hero .hsub{opacity:.92;font-size:1.05rem;max-width:48ch;margin:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--e1);padding:1.85rem;margin-bottom:1.4rem}
  .card h2{font:600 1.5rem var(--serif);letter-spacing:-.02em;margin:0 0 .25rem}
  .card h3{font:700 .74rem var(--sans);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:1.7rem 0 .6rem}
  .sub{color:var(--muted);font-size:.96rem;margin:0 0 1.2rem}
  code{font-family:ui-monospace,Menlo,monospace;background:var(--surface-2);padding:.08rem .4rem;border-radius:6px;font-size:.9em}
  .card ul{margin:.3rem 0 1rem 1.2rem;padding:0} .card li{margin:.45rem 0;line-height:1.5}
  .btn{appearance:none;border:0;border-radius:var(--r-full);font:700 1rem var(--sans);padding:.72rem 1.5rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;transition:transform .12s,filter .15s,background .15s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn.filled{background:var(--primary);color:var(--on-primary)} .btn.filled:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn.tonal{background:var(--primary-soft);color:var(--on-primary-soft);box-shadow:none} .btn.tonal:hover{filter:brightness(.97)}
  .btn.text{background:none;color:var(--primary);box-shadow:none;padding:.72rem .9rem} .btn.text:hover{background:var(--surface-2)}
  .btn.danger{background:none;color:var(--error);box-shadow:none;padding:.6rem 1rem} .btn.danger:hover{background:color-mix(in srgb,var(--error) 14%,transparent)}
  .btn.sm{padding:.45rem 1.05rem;font-size:.9rem}
  .btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-full);padding:.25rem;gap:.25rem;margin:0 0 1.1rem}
  .seg button{appearance:none;border:0;background:none;color:var(--muted);font:700 .9rem var(--sans);padding:.45rem 1.1rem;border-radius:var(--r-full);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
  label.f{display:block;margin:1rem 0}
  label.f span{display:block;font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:.35rem}
  input,textarea,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:var(--r-s);padding:.78rem .9rem;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
  textarea{min-height:80px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
  .copyrow{display:flex;gap:.5rem;align-items:flex-start} .copyrow textarea{flex:1}
  .keybox{padding:.25rem 0 .75rem 3.4rem;border-bottom:1px solid var(--line)}
  .meta.key{cursor:pointer}
  .row{display:flex;align-items:center;gap:.9rem;padding:.85rem .5rem;border-bottom:1px solid var(--line);border-radius:10px;transition:background .12s}
  .row:hover{background:var(--surface-2)} .row:last-child{border-bottom:0}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--primary-soft);color:var(--on-primary-soft);display:flex;align-items:center;justify-content:center;font:800 1.05rem var(--sans);flex-shrink:0}
  .grow{flex:1;min-width:0}
  .name{font-weight:700;font-size:1.03rem} .meta{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--muted);padding:1.1rem 0}
  .kv{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--line)}
  .up{color:var(--ok);font-weight:700}.down{color:var(--error);font-weight:600}
  .thread{display:flex;flex-direction:column;gap:.45rem;max-height:52vh;overflow:auto;padding:.5rem 0}
  .bubble{padding:.6rem .95rem;border-radius:20px;max-width:78%;font-size:.98rem;line-height:1.35}
  .bubble.out{background:var(--primary);color:var(--on-primary);align-self:flex-end;border-bottom-right-radius:6px}
  .bubble.in{background:var(--surface-2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:6px}
  .bubble .who{font-size:.7rem;font-weight:800;opacity:.85;margin-bottom:.15rem}
  .bubble .t{font-size:.68rem;opacity:.7;margin-top:.25rem}
  .composer{display:flex;gap:.5rem;margin-top:1rem} .composer input{border-radius:var(--r-full)}
  #snack{position:fixed;left:50%;bottom:1.75rem;transform:translateX(-50%) translateY(2rem);opacity:0;transition:.25s;background:var(--ink);color:var(--surface);font-weight:600;padding:.9rem 1.4rem;border-radius:var(--r-s);box-shadow:var(--e2);max-width:90vw;z-index:20}
  #snack.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #snack.bad{background:var(--error);color:#fff}
  a{color:var(--primary);font-weight:600}
</style>
</head>
<body>
<div class="bar"><h1>Island Hopper</h1><span class="chip island" id="gate"><span class="dot"></span>…</span><span class="sp"></span><span class="who" id="who"></span><button class="iconbtn" id="theme" title="Light / dark mode"></button></div>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="snack"></div>

<script>
const ADMIN = location.pathname.startsWith("/admin");
const TABS = ADMIN ? [["Admin",Admin],["Home",Home],["Friends",Friends],["Files",Files],["Chat",Chat],["Guide",Guide]]
                   : [["Home",Home],["Friends",Friends],["Files",Files],["Chat",Chat],["Guide",Guide]];
// "Security" (mesh IDS feed) is admin-only AND only on the collector node — added in init.
let tab = TABS[0][0];
const el=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild;};
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initial=(s)=>(s||"?").trim()[0]?.toUpperCase()||"?";
const adminTok=()=>localStorage.getItem("adminTok")||"";
let firstRunToken=null; // set once if this is the first /admin visit (one-time token reveal)
// Inline SVG icons (self-contained, theme-aware via currentColor) — no emoji.
const svg=(b)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const ICONS={
  moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  download: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>'),
  block: svg('<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'),
  alert: svg('<path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
  key: svg('<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2"/><path d="M16 7l3 3"/><path d="M13 10l2.5 2.5"/>'),
};

function snack(msg,bad=false){const s=document.getElementById("snack");s.textContent=msg;s.className="show"+(bad?" bad":"");clearTimeout(s._t);s._t=setTimeout(()=>s.className="",3200);}
async function copy(text){
  // Clipboard API only exists in a secure context (https or localhost). Over the mesh/LAN
  // (plain http, non-localhost) navigator.clipboard is undefined, so fall back to execCommand.
  if(window.isSecureContext&&navigator.clipboard){
    try{await navigator.clipboard.writeText(text);snack("Copied to clipboard");return;}catch{}
  }
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:-9999px;left:-9999px";
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    const ok=document.execCommand("copy");document.body.removeChild(ta);
    snack(ok?"Copied to clipboard":"Copy failed — select manually",!ok);
  }catch{snack("Copy failed — select manually",true);}
}

async function api(path,opts={}){
  const o={...opts,headers:{...(opts.headers||{})}};
  if(o.json!==undefined){o.method=o.method||"POST";o.headers["content-type"]="application/json";o.body=JSON.stringify(o.json);delete o.json;}
  if(adminTok())o.headers["x-admin-token"]=adminTok(); // one admin credential: unlocks operator + admin
  const r=await fetch(path,o);
  if(o.blob&&r.ok)return await r.blob(); // binary responses (file downloads); errors fall through below
  const ct=r.headers.get("content-type")||"";
  const body=ct.includes("json")?await r.json().catch(()=>null):await r.text();
  if(!r.ok)throw new Error((body&&body.error)||("HTTP "+r.status));
  return body;
}

async function refreshGate(){try{const g=await api("/api/gate");const c=document.getElementById("gate");const on=g.state==="internet";const tag=g.target_label?` · ${esc(g.target_label)}`:"";c.className="chip "+(on?"internet":"island");c.innerHTML=`<span class="dot"></span>${g.reachable===false?`Gate node${tag} unreachable`:(on?"Internet access":"Island mode")+tag}`;}catch{}}

let chatPoll=null; // Chat's live-refresh interval; cleared whenever we rebuild a view so it never leaks
let renderGen=0; // bumped every render(); async views capture it and bail if a newer render ran
function render(){
  renderGen++;
  if(chatPoll){clearInterval(chatPoll);chatPoll=null;}
  const nav=document.getElementById("tabs");nav.innerHTML="";
  TABS.forEach(([name])=>{const b=el(`<button>${name}</button>`);if(name===tab)b.className="on";b.onclick=()=>{tab=name;render();};nav.append(b);});
  const v=document.getElementById("view");v.innerHTML="";
  (TABS.find(t=>t[0]===tab)[1])(v);
}

// ---------- Home ----------
async function Home(v){
  const gen=renderGen;
  const hero=el(`<div class="hero island"><div class="eyebrow">…</div><div class="htitle">Loading…</div></div>`);v.append(hero);
  const c=el(`<div class="card"><div id="b" class="empty">Loading…</div></div>`);v.append(c);
  try{
    const d=await api("/api/home");if(gen!==renderGen)return;const on=d.gate.state==="internet";const gtag=d.gate.target_label?` · ${esc(d.gate.target_label)}`:"";
    hero.className="hero "+(on?"internet":"island");
    hero.innerHTML=`<div class="eyebrow">${on?"INTERNET ACCESS":"ISLAND MODE"}${gtag}</div>
      <div class="htitle">${on?"You're hopping the Island":"You're on the island"}</div>
      <div class="hsub">${d.gate.reachable===false?`The gate node${gtag} is unreachable.`:(on?("The gate is open"+(d.gate.closes_at?` · recloses ${new Date(d.gate.closes_at).toLocaleTimeString()}`:"")):"A private network for you and your friends — no internet, by default.")}</div>`;
    c.querySelector("#b").outerHTML=`<div id="b">
      <h3>Connectivity (${esc(d.wg.iface)})</h3>
      ${(()=>{
        const live=d.wg.peers.map(p=>`<div class="row"><div class="avatar">${initial(p.label||p.wg0)}</div><div class="grow"><div class="name">${esc(p.label||"unknown")}</div><div class="meta">${esc(p.wg0)}</div></div><span class="${p.up?"up":"down"}">${p.up?"online":"offline"}</span></div>`);
        // `wg show` needs CAP_NET_ADMIN and islandd runs unprivileged, so the live list is
        // empty on a deployed node — fall back to the wg-selfheal journal roster.
        const jr=live.length?[]:(d.selfheal||[]).filter(s=>s.state&&s.state!=="gone").map(s=>{const on=s.state==="ok"||s.state==="restored";return `<div class="row"><div class="avatar">${initial(s.peer)}</div><div class="grow"><div class="name">${esc(s.peer)}</div><div class="meta">${esc(s.state)}${s.endpoint?` · ${esc(s.endpoint)}`:""}</div></div><span class="${on?"up":"down"}">${on?"online":"offline"}</span></div>`});
        return [...live,...jr].join("")||`<div class="empty">No peers</div>`;
      })()}
      <h3>Friend requests${d.requests.length?` (${d.requests.length})`:""}</h3>
      ${d.requests.map(r=>`<div class="row"><div class="avatar">${initial(r.from_label)}</div><div class="grow"><div class="name">${esc(r.from_label)}</div><div class="meta">wants to connect</div></div></div>`).join("")||`<div class="empty">None — accept invites under Friends</div>`}
      <h3>Security</h3>
      ${(()=>{
        const blocks=d.fail2ban.filter(j=>j.currently_banned>0).map(j=>`<div class="row"><div class="avatar">${ICONS.block}</div><div class="grow"><div class="name">${esc(j.jail)} <span class="meta">· blocked</span></div><div class="meta">${j.currently_banned} IP${j.currently_banned>1?"s":""} banned</div></div></div>`);
        // selfheal is now the FULL roster (ok included) — this panel only surfaces problems
        const heal=(d.selfheal||[]).filter(s=>s.state&&s.state!=="ok").map(s=>`<div class="row"><div class="avatar">${ICONS.alert}</div><div class="grow"><div class="name">${esc(s.peer)} <span class="meta">· self-heal</span></div><div class="meta">${esc(s.state)}${s.endpoint?` (${esc(s.endpoint)})`:""}</div></div></div>`);
        const rows=[...blocks,...heal];
        return rows.length?rows.join(""):`<div class="empty">All clear — no blocks or degraded links</div>`;
      })()}
    </div>`;
  }catch(e){snack(e.message,true);}
}

// ---------- Friends (streamlined) ----------
async function Friends(v){
  const gen=renderGen;
  const list=el(`<div class="card"><h2>Your friends</h2><div id="l" class="empty">Loading…</div></div>`);v.append(list);
  let pending=[];
  try{
    const d=await api("/api/friends");pending=d.pending;
    const me=await api("/api/identity").catch(()=>null);
    if(gen!==renderGen)return; // a newer render wiped the view while we were loading
    const meRow=me?`<div class="row"><div class="avatar">${initial(me.label)}</div><div class="grow"><div class="name">${esc(me.label)} <span class="meta">· your friend code</span></div><div class="meta key" data-copy="${esc(me.code)}" title="your friend code — click to copy" style="font-weight:700;color:var(--ink)">${esc(me.code)}</div></div><button class="btn tonal sm" data-copy="${esc(me.code)}">Copy code</button><button class="btn text sm" data-copy="${esc(me.ed25519)}">Key</button></div>`:"";
    const friendRows=d.friends.map((f,i)=>`
      <div class="row"><div class="avatar">${initial(f.peer.label)}</div>
        <div class="grow"><div class="name">${esc(f.peer.label)}</div><div class="meta key" data-view="${i}" title="show full key">${esc(f.peer.ed25519.slice(0,24))}…</div></div>
        <button class="btn text sm" data-view="${i}">Key</button>
        <button class="btn danger sm" data-rm="${esc(f.peer.ed25519)}">Remove</button></div>
      <div class="keybox" id="kb${i}" style="display:none">
        <label class="f"><span>identity key (ed25519)</span><div class="copyrow"><textarea readonly>${esc(f.peer.ed25519)}</textarea><button class="btn tonal sm" data-copy="${esc(f.peer.ed25519)}">Copy</button></div></label>
        <label class="f"><span>encryption key (x25519)</span><div class="copyrow"><textarea readonly>${esc(f.peer.x25519)}</textarea><button class="btn tonal sm" data-copy="${esc(f.peer.x25519)}">Copy</button></div></label>
      </div>`).join("");
    list.querySelector("#l").outerHTML=`<div id="l">${meRow}${friendRows||`<div class="empty">No friends yet — add one below</div>`}</div>`;
    list.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{const kb=list.querySelector("#kb"+b.dataset.view);kb.style.display=kb.style.display==="none"?"":"none";});
    list.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy));
    list.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm("Remove this friend? The friendship is removed on both nodes."))return;try{const r=await api("/api/friends/"+encodeURIComponent(b.dataset.rm),{method:"DELETE"});snack(r&&r.peer_notified?"Friend removed on both sides":"Removed here — peer unreachable, their side still lists you");render();}catch(e){snack(e.message,true);}});
  }catch(e){snack(e.message,true);}
  if(gen!==renderGen)return; // don't append the cards below into a newer view

  // Add a friend — one card, two methods via a segmented switch:
  //   By code  → resolve via the registry, signed handshake over the mesh (primary)
  //   By invite → exchange invite/reply blobs by hand (offline fallback, no registry)
  const add=el(`<div class="card"><h2>Add a friend</h2>
    <div class="seg" id="seg"><button data-pane="code" class="on">By code</button><button data-pane="invite">By invite</button></div>
    <div id="pane-code">
      <p class="sub">Enter a friend's code to connect.</p>
      <div class="row" style="border:0;padding-top:0"><input id="code" placeholder="ISL-XXXXX-XXXXX" autocomplete="off" style="text-transform:uppercase"><button class="btn filled" id="addbtn">Add</button></div>
    </div>
    <div id="pane-invite" style="display:none">
      <p class="sub">Use this when there's no registry, or to pair with someone off the mesh. You'll swap two codes by hand — an <b>invite</b> and a <b>reply</b>. One person creates the invite; the other accepts it and sends a reply back to finish. Send the codes over any channel you trust (chat, email, in person).</p>
      <h3>Create an invite</h3>
      <p class="sub">Do this if <b>you're</b> starting the pairing:<br>1. Press <b>Create invite</b> and send the invite code to your friend.<br>2. They accept it and send you back a <b>reply</b> code.<br>3. Paste their reply below and press <b>Finish</b> — you're now friends.</p>
      <button class="btn filled" id="mk">Create invite</button>

async function Chat(v){
  const gen=renderGen;
  let friends=[];try{friends=(await api("/api/friends")).friends;}catch(e){snack(e.message,true);}
  if(gen!==renderGen)return; // a newer render wiped the view — don't append or start a poller
  if(!friends.length){v.append(el(`<div class="card"><h2>Messages</h2><div class="empty">Add a friend first to start chatting.</div></div>`));return;}
  const c=el(`<div class="card"><h2>Messages</h2>
    <label class="f"><span>Conversation</span><select id="peer">${friends.map(f=>`<option value="${esc(f.peer.ed25519)}">${esc(f.peer.label)}</option>`).join("")}</select></label>
    <div class="thread" id="th"></div>
    <div class="composer"><input id="body" placeholder="Message…" autocomplete="off"><button class="btn filled" id="send">Send</button></div></div>`);v.append(c);
  const sel=c.querySelector("#peer");
  let lastSig=""; // skip DOM churn when the thread hasn't changed (the poller runs every few seconds)
  // force=true on user actions (peer switch / send): always redraw and pin to the newest message.
  async function load(force){try{
    const peer=sel.value; // pin the conversation this fetch is for
    const fr=friends.find(f=>f.peer.ed25519===peer);const peerLabel=fr?fr.peer.label:"friend";
    const d=await api("/api/messages?peer="+encodeURIComponent(peer));
    if(peer!==sel.value)return; // user switched conversations mid-flight — don't overwrite the new thread
    const sig=peer+"|"+d.thread.length+"|"+(d.thread.at(-1)?.ts||"");
    if(!force&&sig===lastSig)return; // nothing new — leave the DOM (and any text selection) alone
    lastSig=sig;
    const th=c.querySelector("#th");
    const atBottom=th.scrollHeight-th.scrollTop-th.clientHeight<40; // are they already reading the latest?
    th.innerHTML=d.thread.map(m=>`<div class="bubble ${m.dir}"><div class="who">${m.dir==="out"?"You":esc(peerLabel)}</div>${esc(m.body)}<div class="t">${new Date(m.ts).toLocaleTimeString()}</div></div>`).join("")||`<div class="empty">No messages yet</div>`;
    if(force||atBottom)th.scrollTop=1e9; // only jump to newest if they were already there (don't yank scroll-back)
  }catch(e){if(force)snack(e.message,true);}} // stay quiet on background poll failures
  sel.onchange=()=>load(true);load(true);
  chatPoll=setInterval(load,3000); // live refresh; render() clears this when you leave the Chat tab
  const send=async()=>{const btn=c.querySelector("#send");if(btn.disabled)return;const body=c.querySelector("#body").value.trim();if(!body)return;btn.disabled=true;try{const r=await api("/api/messages",{json:{peer:sel.value,body}});c.querySelector("#body").value="";if(!r.delivered)snack("Sent — friend is offline");load(true);}catch(e){snack(e.message,true);}finally{btn.disabled=false;}};
  c.querySelector("#send").onclick=send;c.querySelector("#body").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
}

// ---------- Security (admin-only, collector node only): the mesh IDS feed ----------
// Renders a full per-peer roster (every link's status, ok included) plus fail2ban blocks.
// Two sources: THIS node's live roster (from /api/home — its own wg + wg-selfheal journal,
// always available, no report round-trip) merged with the cross-node report store
// (/admin/events). The local rows are why the tab is never empty just because remote
// reports haven't landed — the journal is read directly here.
const SEC_PILL={ok:"#1a7f37",restored:"#1a7f37",stale:"#9a6700",degraded:"#cf222e",gone:"#57606a"}; // status → colour
const SEC_SEV={degraded:0,gone:1,stale:2,restored:3,ok:4};                                          // worst first
const SEC_STALE_S=150,SEC_DEGR_S=180; // link ladder — MUST match daemon/sysinfo (classifyLink)
// Peers hard-ignored in the feed regardless of what any node reports. 10.42.0.6 is a
// node that may or may not return; suppress it here so it never clutters the roster.
const SEC_IGNORE=["10.42.0.6"];
const SEC_STALE_MS=180000; // no report in 3× the 60s push interval ⇒ reporter is stalled
function secIgnored(e){const hay=`${e.subject} ${e.detail}`;return SEC_IGNORE.some(ip=>hay.includes(ip));}
function secRank(e){return e.kind==="fail2ban"?0:(SEC_SEV[e.state]??2);}
function secClassify(a){return a==null||a>=SEC_DEGR_S?"degraded":a>=SEC_STALE_S?"stale":"ok";}
// Build this node's roster straight from /api/home. Two sources: live wg peers first,
// then wg-selfheal journal peers the live read didn't cover. On a deployed node the
// live list is EMPTY (`wg show` needs CAP_NET_ADMIN; islandd is unprivileged), so the
// daemon's journal — which islandd CAN read — is the usual roster source.
function secLocalRows(home,nowIso){
  if(!home)return [];
  const dmap=new Map((home.selfheal||[]).map(s=>[s.peer,s]));
  const rows=((home.wg&&home.wg.peers)||[]).map(p=>{
    const ip=p.wg0||"?",d=dmap.get(p.wg0);dmap.delete(p.wg0);
    let state=secClassify(p.handshake_age_s);
    if(d&&d.state==="restored"&&state==="ok")state="restored"; // daemon adds the debounced recovery
    const age=p.handshake_age_s==null?"no handshake yet":`${p.handshake_age_s}s since handshake`;
    const detail=[p.label?ip:null,age,(d&&d.endpoint)||null].filter(Boolean).join(" — ");
    return {kind:"link",subject:p.label||ip,detail,state,node:"this node",at:nowIso,stale:false};
  });
  for(const [peer,s] of dmap){
    if(!s.state)continue;
    const age=s.handshakeAge?(s.handshakeAge==="never"?"no handshake yet":`handshake ${s.handshakeAge} ago`):null;
    rows.push({kind:"link",subject:peer,detail:[age,s.endpoint||null].filter(Boolean).join(" — "),state:s.state,node:"this node",at:nowIso,stale:false});
  }
  for(const j of (home.fail2ban||[]))for(const ip of (j.banned_ips||[]))rows.push({kind:"fail2ban",subject:ip,detail:`blocked by ${j.jail}`,node:"this node",at:nowIso,stale:false});
  return rows;
}
async function Security(v){
  const gen=renderGen;
  const c=el(`<div class="card"><h2>Security</h2><p class="sub">Every peer's link status across the mesh, plus fail2ban blocks.</p><div id="b" class="empty">Loading…</div></div>`);v.append(c);
  try{
    // Local roster (/api/home) is always available; remote reports (/admin/events) fill in the
    // rest of the mesh. Either may be empty; render whatever we have.
    const [d,home]=await Promise.all([api("/admin/events").catch(()=>({nodes:[]})),api("/api/home").catch(()=>null)]);
    if(gen!==renderGen)return; // a newer render wiped the view while we were loading
    const now=Date.now(),nowIso=new Date(now).toISOString();
    const remote=(d.nodes||[]).flatMap(n=>{
      const stale=n.received?now-new Date(n.received).getTime()>SEC_STALE_MS:false;
      return (n.events||[]).map(e=>({...e,node:n.label,at:n.at,stale}));
    });
    const rows=[...secLocalRows(home,nowIso),...remote].filter(e=>!secIgnored(e));
    // Worst status first, then most-recent report; a stalled node's rows sink to the bottom.
    rows.sort((a,b)=>(a.stale-b.stale)||(secRank(a)-secRank(b))||b.at.localeCompare(a.at));
    c.querySelector("#b").outerHTML=`<div id="b">${rows.length?rows.map(e=>{
      const healthy=e.state==="ok"||e.state==="restored";
      const av=e.kind==="fail2ban"?ICONS.block:healthy?`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${SEC_PILL[e.state]}"></span>`:ICONS.alert;
      const pill=e.state?` <span style="font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;background:${SEC_PILL[e.state]||"#57606a"}">${esc(e.state)}</span>`:"";
      const staleTag=e.stale?` <span class="meta" style="color:#9a6700">· no report in ${Math.round((now-new Date(e.at).getTime())/60000)}m</span>`:"";
      return `<div class="row"${e.stale?' style="opacity:.55"':""}><div class="avatar">${av}</div><div class="grow"><div class="name">${esc(e.subject)}${pill} <span class="meta">· ${esc(e.kind)}</span></div><div class="meta">${esc(e.detail)} — on ${esc(e.node)} · ${new Date(e.at).toLocaleString()}${staleTag}</div></div></div>`;
    }).join(""):`<div class="empty">No nodes reporting yet</div>`}</div>`;
  }catch(e){snack(e.message,true);}
}

    <p class="sub"><i>Why only once?</i> Until someone saves it, anyone who opened this page could read the token — so the node hands it to the first person setting it up, then locks it away. That's why doing your setup at <code>/admin</code> first is the easy, safe path.</p>
    <h3>Signing in again, or on another device</h3>
    <p class="sub">Already saved it? To sign in anywhere — your phone, another computer — open <code>/admin</code>, click the <b>lock</b> in the top bar, and paste the token. Green lock = you're in; click it again to change or clear it. <i>(Advanced: a tech‑savvy admin can set a chosen token on the device as <code>ISLAND_ADMIN_TOKEN</code>; in the demo there's no token at all, so admin is open.)</i></p>
    <h3>Manage friendships</h3>
    <p class="sub">Admin → Manage friendships → <b>Remove</b>. You can remove any friendship, but you can never <i>force</i> one — that needs both people's keys. Security by design.</p>
    <h3>The internet gate</h3>
    <ul>
      <li>The island is sealed by default (island mode).</li>
      <li>Admin → <b>Internet access</b> → enter the <b>special prompt for Llama</b> → <b>Open gate</b>. Llama (the node's secure key holder) reads it and, if it approves, opens internet access for <b>45 minutes</b>, then closes automatically. <b>Close</b> ends it early.</li>
      <li>Every screen's banner shows the current state.</li>
    </ul>
    <h3>Managing a headless device (e.g. a Pi with no screen)</h3>
    <ul>
      <li><b>From a browser:</b> on another island device, open <code>http://&lt;node-address&gt;:8787/admin</code>, unlock with the admin token, and manage it normally.</li>
      <li><b>From a terminal (SSH):</b> <code>islandd friend invite</code> / <code>accept</code> / <code>confirm</code> / <code>list</code>.</li>
    </ul>
  </div>`));
}

function applyTheme(t){document.documentElement.setAttribute("data-theme",t);document.getElementById("theme").innerHTML=t==="dark"?ICONS.sun:ICONS.moon;}
let theme=localStorage.getItem("theme")||(matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
applyTheme(theme);
document.getElementById("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.setItem("theme",theme);applyTheme(theme);};
// The admin lock lives ONLY on /admin (it's an admin concern). On the user app there's
// no lock; once unlocked at /admin the token is in localStorage and api() sends it.
let refreshAuth=()=>{};
if(ADMIN){
  const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const UNLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.6-1.6"/></svg>';
  const b=el('<button class="iconbtn lockbtn" id="auth"></button>');
  document.querySelector(".bar").insertBefore(b,document.getElementById("who"));
  refreshAuth=()=>{const set=!!adminTok();b.innerHTML=(set?UNLOCK:LOCK)+"<span>"+(set?"Admin":"Unlock admin")+"</span>";b.classList.toggle("on",set);b.title=set?"Admin unlocked — click to change or clear":"Admin locked — click to enter the admin token";};
  b.onclick=()=>{const v=prompt("Admin token — the password that unlocks managing this node (friends, gate, settings). Set on the device as ISLAND_ADMIN_TOKEN; leave blank in demo mode.","");if(v!==null){localStorage.setItem("adminTok",v.trim());refreshAuth();snack(v.trim()?"Admin unlocked":"Admin cleared");render();}};
  refreshAuth();
}
// First /admin visit on a fresh node: claim the one-time token reveal (server consumes
// it). If we get one, sign this browser in and let Admin() show it once to save.
async function claimFirstRun(){
  if(!ADMIN||adminTok())return;
  try{const r=await api("/admin/firstrun");if(r&&r.token){firstRunToken=r.token;localStorage.setItem("adminTok",r.token);refreshAuth();}}catch{}
}
(async()=>{try{const h=await api("/api/health");document.getElementById("who").textContent=(ADMIN?"admin · ":"")+(h.mock?"demo":"node")+" · v"+h.version;if(ADMIN&&h.events)TABS.splice(1,0,["Security",Security]);}catch{}await claimFirstRun();refreshGate();render();})();
</script>
